name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import pathlib,re; text=pathlib.Path("src/git_path_doctor/__init__.py").read_text(); print(re.search(r"__version__ = \"([^\"]+)\"", text).group(1))')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Git Path Doctor ${GITHUB_REF_NAME}"
